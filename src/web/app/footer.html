<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#004594;color:#dfe8f5;font:11px Verdana,Tahoma,sans-serif;user-select:none}
.bar{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 10px;border-top:3px solid #fb6705;box-sizing:border-box;gap:14px}
b{color:#fff} .o{color:#fb6705;font-weight:bold}
a{color:#ffd9bf;text-decoration:none;cursor:pointer} a:hover{color:#fff;text-decoration:underline}
#um{color:#fff}
.bar>span{white-space:nowrap}
.mid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}
</style><script src="i18n.js"></script></head><body><div class="bar">
<span><b>Officina</b><span class="o">ONE</span> &nbsp;v<span id="v"></span> &nbsp;·&nbsp; <a id="upd">Verifica aggiornamenti</a> <span id="um"></span></span>
<span class="mid" title="Progetto amatoriale gratuito, senza scopo di lucro · Non affiliato a Fiat/Stellantis · I contenuti dei manuali appartengono ai rispettivi titolari · Vietata la vendita">Progetto amatoriale gratuito, senza scopo di lucro · Non affiliato a Fiat/Stellantis · I contenuti dei manuali appartengono ai rispettivi titolari · Vietata la vendita</span>
<span><a id="rep">✉ Invia segnalazione</a> &nbsp;·&nbsp; Ultimo aggiornamento: <b id="d"></b></span>
</div><script>
const i=elearnApp.info(); document.getElementById('v').textContent=i.version; document.getElementById('d').textContent=i.updated;
document.getElementById('rep').onclick=()=>elearnApp.report();
const um=document.getElementById('um');
document.getElementById('upd').onclick=async()=>{um.textContent='verifica…';const r=await elearnApp.updateCheck();
 um.textContent=r&&r.found?'':r&&r.error?'(non raggiungibile)':'(nessun aggiornamento)';setTimeout(()=>um.textContent='',6000);};
</script></body></html>
