<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f4f4f4;border-bottom:1px solid #c8c8c8;font:12px Tahoma,Verdana,sans-serif;user-select:none}
.bar{display:flex;align-items:center;height:100%;padding-left:3px;gap:2px}
button{height:22px;min-width:23px;border:1px solid transparent;background:none;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:2px;font:bold 11px Tahoma,Verdana;color:#004594;cursor:default}
button:hover:not(:disabled){border-color:#9ab;background:#e3ecf5}
button:active:not(:disabled){background:#cddbe9}
button:disabled svg{opacity:.35;filter:grayscale(1)}
button.on{background:#004594;color:#fff}
.sep{width:1px;height:16px;background:#ccc;margin:0 4px}
#tabs{display:flex;align-items:flex-end;height:100%;flex:1;overflow:hidden;gap:2px;margin-left:4px}
.tab{display:flex;align-items:center;gap:6px;max-width:230px;min-width:60px;height:21px;padding:0 6px 0 10px;background:#dfe5ee;border:1px solid #c3cdda;border-bottom:0;border-radius:5px 5px 0 0;font-size:11px;color:#333;cursor:default}
.tab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.tab.a{background:#fff;color:#004594;font-weight:bold;border-color:#fb6705;box-shadow:inset 0 2px 0 #fb6705}
.tab i{font-style:normal;color:#888;border-radius:3px;width:14px;text-align:center}
.tab i:hover{background:#c00;color:#fff}
#plus{font-size:15px;color:#555}
#tmr{font-weight:normal;color:#333;min-width:70px}#tmr.run{background:#fb6705;color:#fff}#tmr span{font-variant-numeric:tabular-nums}
</style><script src="i18n.js"></script></head><body><div class="bar">
<button id="back" title="Indietro"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1.5 8 7 3v3h7.5v4H7v3z" fill="#2ec4d6" stroke="#06606e" stroke-width="1"/></svg></button>
<button id="fwd" title="Avanti"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M14.5 8 9 3v3H1.5v4H9v3z" fill="#2ec4d6" stroke="#06606e" stroke-width="1"/></svg></button>
<button id="exit" title="Esci"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.6" fill="#e3121b" stroke="#7a0006"/><circle cx="7" cy="6" r="3" fill="#ff8a8a" opacity=".5"/><path d="M6 6l6 6M12 6l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
<div class="sep"></div>
<div id="tabs"></div>
<button id="plus" title="Nuova scheda (Ctrl+T)">＋</button>
<div class="sep"></div>
<button id="tmr" title="Cronometro di lavoro: clic per avviare/fermare, doppio clic per azzerare">⏱ <span id="tmv">00:00</span></button>
<div class="sep"></div>
<button id="big" title="Modalità officina: testo grande">A+</button>
<button id="night" title="Modalità notte">☾</button>
<span style="width:6px"></span>
</div><script>
const b=document.getElementById('back'),f=document.getElementById('fwd'),T=document.getElementById('tabs');
b.onclick=()=>elearnApp.back(); f.onclick=()=>elearnApp.forward();
document.getElementById('exit').onclick=()=>elearnApp.exit();
document.getElementById('plus').onclick=()=>elearnApp.tabNew();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
const big=document.getElementById('big'),night=document.getElementById('night');
function paint(){big.classList.toggle('on',ls('elearn.theme.big')==='1');night.classList.toggle('on',ls('elearn.theme.night')==='1');}
big.onclick=()=>{ls('elearn.theme.big',ls('elearn.theme.big')==='1'?'0':'1');paint();elearnApp.reloadAll();};
night.onclick=()=>{ls('elearn.theme.night',ls('elearn.theme.night')==='1'?'0':'1');paint();elearnApp.reloadAll();};
paint();
// cronometro di lavoro
const tmr=document.getElementById('tmr'),tmv=document.getElementById('tmv');
let T0=+ls('elearn.tmr.start')||0,ACC=+ls('elearn.tmr.acc')||0,clk=null;
function fmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function tick(){tmv.textContent=fmt(ACC+(T0?Date.now()-T0:0));tmr.classList.toggle('run',!!T0);}
function save(){ls('elearn.tmr.start',String(T0));ls('elearn.tmr.acc',String(ACC));}
tmr.onclick=()=>{clearTimeout(clk);clk=setTimeout(()=>{if(T0){ACC+=Date.now()-T0;T0=0}else T0=Date.now();save();tick();},220);};
tmr.ondblclick=()=>{clearTimeout(clk);T0=0;ACC=0;save();tick();};
setInterval(tick,1000);tick();
elearnApp.onNavState(s=>{b.disabled=!s.back;f.disabled=!s.forward;
  if(!s.tabs)return; T.innerHTML='';
  s.tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t.active?' a':'');d.title=t.title;
    const sp=document.createElement('span');sp.textContent=t.title;d.appendChild(sp);
    if(s.tabs.length>1){const x=document.createElement('i');x.textContent='✕';x.title='Chiudi scheda';x.onclick=e=>{e.stopPropagation();elearnApp.tabClose(t.id)};d.appendChild(x);}
    d.onclick=()=>elearnApp.tabSelect(t.id); d.onauxclick=e=>{if(e.button===1)elearnApp.tabClose(t.id)};
    T.appendChild(d);});
});
</script></body></html>
