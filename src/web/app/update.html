<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Aggiornamento OfficinaONE</title><style>
html,body{margin:0;font:13px Verdana,Tahoma,sans-serif;color:#222;background:#fff;user-select:none}
.h{background:#004594;border-bottom:4px solid #fb6705;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.h img{height:44px}.h b{font-size:15px}
.c{padding:16px 18px}
.notes{background:#eef3fa;border-left:4px solid #004594;padding:8px 10px;margin:10px 0;white-space:pre-wrap;max-height:110px;overflow:auto;font-size:12px}
.bar{height:16px;border:1px solid #004594;border-radius:3px;overflow:hidden;display:none;margin-top:10px}.bar div{height:100%;width:0;background:#fb6705;transition:width .2s}
.msg{font-size:12px;color:#004594;margin-top:6px;min-height:16px}.err{color:#c00}
.btns{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
button{font:bold 12px Verdana;border:0;border-radius:3px;padding:8px 16px;cursor:pointer}
#go{background:#fb6705;color:#fff}#go:hover{background:#004594}#later{background:#e4e4e4}
button:disabled{opacity:.5;cursor:default}
</style><script src="i18n.js"></script></head><body>
<div class="h"><img src="logo@2x.jpg"><div><b>È disponibile un aggiornamento</b><br><span id="ver"></span></div></div>
<div class="c"><div>Le novità di questa versione:</div><div class="notes" id="notes"></div>
<div class="bar" id="bar"><div></div></div><div class="msg" id="msg"></div></div>
<div class="btns"><button id="later">Più tardi</button><button id="go">Aggiorna</button></div>
<script>
const i=elearnApp.updateInfo();
document.getElementById('ver').textContent='OfficinaONE '+i.version+' (installata: '+i.current+')';
document.getElementById('notes').textContent=i.notes||'Miglioramenti e correzioni.';
const go=document.getElementById('go'),later=document.getElementById('later'),bar=document.getElementById('bar'),msg=document.getElementById('msg');
later.onclick=()=>window.close();
if(i.forced){later.textContent='Esci';document.querySelector('.h b').textContent='Aggiornamento obbligatorio';
 document.getElementById('notes').insertAdjacentHTML('beforebegin','<div style="color:#c00;font-weight:bold;margin:6px 0">È uscita una nuova versione: per continuare a usare OfficinaONE devi installarla. Con «Esci» il programma si chiude.</div>');}
go.onclick=()=>{go.disabled=later.disabled=true;bar.style.display='block';msg.className='msg';msg.textContent='Download in corso…';elearnApp.updateStart();};
elearnApp.onUpdate(p=>{
  if(p.error){msg.className='msg err';msg.textContent=p.error;go.disabled=later.disabled=false;go.textContent='Riprova';return;}
  if(p.total){bar.firstChild.style.width=(p.done/p.total*100).toFixed(1)+'%';msg.textContent='Download '+(p.done/1048576).toFixed(1)+' / '+(p.total/1048576).toFixed(1)+' MB';}
  else if(p.done) msg.textContent='Download '+(p.done/1048576).toFixed(1)+' MB';
  if(p.installing){bar.firstChild.style.width='100%';msg.textContent='Installazione in corso: OfficinaONE si chiuderà e si riaprirà da solo…';}
});
</script></body></html>
